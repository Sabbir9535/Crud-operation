<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Ultra-premium, minimalist styling */
        :root {
            --bg-color: #fafafa;
            --surface-color: #ffffff;
            --text-main: #171717;
            --text-muted: #737373;
            --border-color: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 3rem 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-text h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.04em;
        }

        .header-text p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .badge {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 99px;
            background: var(--surface-color);
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
        }

        .card-id {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .user-name {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
            text-transform: capitalize;
        }

        .user-email {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 0.75rem;
        }

        .info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 500;
            color: var(--text-main);
            text-align: right;
        }

        .null-value {
            color: #a3a3a3;
            font-weight: 400;
            font-style: italic;
        }

        .status-message {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.1rem;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-text">
                <h1>Users Directory</h1>
                <p>Overview of all registered accounts from Neon DB</p>
            </div>
            <div class="badge">Total: <span id="count">0</span></div>
        </header>

        <div id="grid" class="grid">
            <div class="status-message" id="statusMessage">Fetching data... Please wait.</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchUsers();
        });

        // Helper function to handle null values gracefully
        const checkNull = (value) => {
            if (value === null || value === undefined || value === "") {
                return '<span class="null-value">Not Provided</span>';
            }
            return value;
        };

        async function fetchUsers() {
            const grid = document.getElementById('grid');
            const countElement = document.getElementById('count');
            const statusMessage = document.getElementById('statusMessage');

            try {
                // Fetch data from your local server connected to Neon DB
                const response = await fetch('http://localhost:5000/users');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const users = result.data;
                    countElement.innerText = users.length;
                    
                    // Clear loading message
                    grid.innerHTML = '';

                    // Generate cards for each user
                    users.forEach(user => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        card.innerHTML = `
                            <div class="card-id">ID: #${user.id}</div>
                            <h2 class="user-name">${checkNull(user.name)}</h2>
                            <p class="user-email">${checkNull(user.email)}</p>
                            
                            <div class="info-list">
                                <div class="info-item">
                                    <span class="info-label">Age</span>
                                    <span class="info-value">${checkNull(user.age)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Phone</span>
                                    <span class="info-value">${checkNull(user.phone)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Address</span>
                                    <span class="info-value">${checkNull(user.address)}</span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="status-message">No users found in the database.</div>';
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                grid.innerHTML = `
                    <div class="status-message error">
                        Failed to load data. Make sure your server is running on localhost:5000 and CORS is enabled.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
